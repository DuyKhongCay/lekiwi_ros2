/**:
  ros__parameters:
    tag_family: "36h11"
    tag_size: 0.02
    tag_distance: 0.38

    # Tag definitions in chessboard_frame (origin at A1):
    # +X: A1 -> H1 (File A -> H)
    # +Y: A1 -> A8 (Rank 1 -> 8)
    # +Z: Normal pointing up perpendicular to the board
    tags:
      ids: [1, 4, 3, 6]
      names: ["A1", "H1", "H8", "A8"]
      positions_x: [0.000, 0.380, 0.380, 0.000]
      positions_y: [0.000, 0.000, 0.380, 0.380]
      positions_z: [0.000, 0.000, 0.000, 0.000]
      yaws: [0.0, 0.0, 0.0, 0.0]

    # Frame IDs
    map_frame: "map"
    chessboard_frame: "chessboard_frame"
    camera_frame: "stereo_left_optical"
    base_frame: "base_link"

    # Board nominal pose in map: [x, y, z, roll, pitch, yaw]
    chessboard_pose_in_map: [1.0, 0.0, 0.75, 0.0, 0.0, 0.0]

    # TF Broadcasting
    publish_tf: true
    publish_map_to_chessboard: true
    publish_camera_to_board: true

    # Nav2 Costmap Keepout zone
    keepout:
      publish_polygon: true
      safety_margin: 0.035   # 0.38m + 2 * 0.035m = 0.45m
      publish_rate: 2.0       # Hz

