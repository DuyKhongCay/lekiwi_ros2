/**:
  ros__parameters:
    # Global Debug Flag for Perception Pipeline
    debug: false

    # Common Topics & Frames
    frame_id: "stereo_left_optical"
    camera_topic: "/cameras/stereo_left/image_raw"
    fen_topic: "/chess/raw_fen"
    detections_topic: "/chess/detections_2d"
    tag_centers_topic: "/chess/tag_centers"
    grid_points_topic: "/chess/grid_points"

    # AprilTag IDs for Chessboard Corners (A1, H1, H8, A8)
    tags:
      ids: [0, 1, 2, 3]

hailo_chess_inference:
  ros__parameters:
    # frame_id: "stereo_left_optical"
    # camera_topic: "/cameras/stereo_left/image_raw"
    # fen_topic: "/chess/fen"
    # detections_topic: "/chess/detections_2d"
    # tag_centers_topic: "/chess/tag_centers"
    # grid_points_topic: "/chess/grid_points"

    # Hailo Hardware & Models
    vdevice_group_id: "lekiwi_chess"
    board_hef_path: /root/docker_ws/lekiwi_ros2/install/lekiwi_perception/share/lekiwi_perception/resources/models/yolov8n-seg.hef
    pcs_hef_path: /root/docker_ws/lekiwi_ros2/install/lekiwi_perception/share/lekiwi_perception/resources/models/yolo11n.hef

    # Processing & Game State Parameters
    transition_timeout_ms: 5000
    history_window_size: 3
    confidence_threshold: 0.35

    debug: false

chess_overlay_visualizer:
  ros__parameters:
    # camera_topic: "/cameras/stereo_left/image_raw"
    # detections_topic: "/chess/detections_2d"
    # tag_centers_topic: "/chess/tag_centers"
    # grid_points_topic: "/chess/grid_points"
    overlay_topic: "/chess/overlay_image/compressed"
    jpeg_quality: 85
    debug: true

chessboard_pose_estimator:
  ros__parameters:
    tag_family: "16h5"
    tag_size: 0.029
    detection_rate_hz: 10.0
    calib: false
    min_tags_cnt: 2

    # Calibrated tag definitions in chessboard_frame (origin at CENTER of board):
    # +X: File A -> H (Left -> Right)
    # +Y: Rank 1 -> 8 (Bottom -> Top)
    # +Z: Normal pointing up perpendicular to the board
    tags:
      # Calibration Date & Time: 2026-09-22 00:08:07
      ids: [0, 1, 2, 3]
      names: ["A1", "H1", "H8", "A8"]
      positions_x: [-0.1922, 0.1915, 0.1912, -0.1905]
      positions_y: [-0.1915, -0.1933, 0.1918, 0.193]
      positions_z: [0.006, 0.006, 0.006, 0.006]
      yaws: [0.0, 0.0235, -0.0141, 0.0043]

    # Frame IDs
    map_frame: "map"
    odom_frame: "odom"
    chessboard_frame: "chessboard_frame"
    camera_frame: "stereo_left_optical"
    base_frame: "base_footprint"

    # Board nominal pose in map: [x, y, z, roll, pitch, yaw]
    chessboard_pose_in_map: [0.0, 0.0, 0.006, 0.0, 0.0, 0.0]

    # Static TF Broadcasting (map -> chessboard_frame)
    publish_tf: true
    board_markers_topic: "chessboard_tag_markers"

    # Dynamic Velocity-Dependent Covariance Configuration
    odom_topic: "/omni_base_controller/odom"
    odom_timeout_sec: 0.5
    covariance:
      base_pos_var: 0.0001    # 1 cm std khi đứng yên
      base_rot_var: 0.0004    # 1.15° std khi đứng yên
      vel_scale_pos: 0.01     # m²/(m/s)² - tăng variance theo speed²
      vel_scale_rot: 0.05     # rad²/(rad/s)² - tăng variance theo wz²
      max_pos_var: 0.01       # 10 cm std clamp tối đa
      max_rot_var: 0.04       # ~11.5° std clamp tối đa
      scale_by_tag_count: true
