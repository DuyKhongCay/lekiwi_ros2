# ==============================================================================
# LeKiwi Mission, Supervision & Manipulation Configuration
# Package: lekiwi_bringup/config/control/orchestrator.yaml
# Distro: ROS 2 Jazzy
# ==============================================================================

# ==============================================================================
# TIER 0: Global Subsystem Defaults (SSOT - Single Source of Truth)
# All nodes inheriting this file automatically receive these definitions
# ==============================================================================
/**:
  ros__parameters:
    # --- System Operational Mode ---
    record: false                   # System-wide operational mode flag (overridden by launch)

    # --- Universal Coordinate Frames ---
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_footprint"
    board_frame: "chessboard_frame"
    tip_frame: "gripperframe"

    # --- Core Subsystem Topics ---
    joint_states_topic: "/joint_states"

    # --- Physical Arm Geometry & Kinematic Limits ---
    sampling_rate_hz: 50.0
    arm_joints:
      - "arm_shoulder_pan"
      - "arm_shoulder_lift"
      - "arm_elbow_flex"
      - "arm_wrist_flex"
      - "arm_wrist_roll"
      - "arm_gripper"

    # --- End-Effector Gripper Physical Limits (rad) ---
    gripper:
      open: 0.39
      closed: -0.10

    # --- Pre-Calibrated Landmark Poses ---
    named_poses:
      approach: [0.0414, -0.0199, 0.0598, -0.0552, -1.57, 0.0798]
      stow: [1.5616, -1.7411, 1.5570, 0.7747, -2.7888, 0.0813]
      clear_left: [-1.9804, -0.3375, 0.3927, 1.4972, -1.5631, 0.0828]
      clear_right: [2.0632, -0.2301, 0.3405, 1.5079, -1.5723, 0.0828]

    # --- Shared Manipulation Planning Defaults ---
    planning:
      default_pitch: -1.2217304764
      default_roll: 1.57
      grasp_z: 0.035


# ==============================================================================
# TIER 1: System Readiness & Safety Supervisor
# Gating and health monitoring for safe navigation and manipulation
# ==============================================================================
system_readiness_node:
  ros__parameters:
    check_frequency_hz: 10.0
    max_pos_variance: 0.0016
    max_yaw_variance: 0.0030
    max_transform_age_sec: 0.30
    nav_odom_max_age_sec: 0.50
    max_stop_velocity: 0.03
    max_stop_angular_vel: 0.20
    stationary_unlatch_debounce_sec: 0.25
    require_global_ekf_seed: true
    nav2_lifecycle_service: "/lifecycle_manager_navigation/is_active"
    nav2_check_frequency_hz: 2.0
    local_odom_topic: "/odometry/local"
    global_odom_topic: "/odometry/global"


# ==============================================================================
# TIER 2: Workspace Kinematics & Standoff Feasibility Checker
# Analytical IK solving & multi-tier navigation standoff planning
# ==============================================================================
workspace_checker:
  ros__parameters:
    board_size: [0.380, 0.380]
    planning:
      edge_clearance: 0.16
      sample_step: 0.025
      max_samples: 257
      grasp_z: 0.035
    tf:
      max_age_sec: 0.30
      planar_tolerance_rad: 0.01



# ==============================================================================
# TIER 3: Arm Manipulation & Interactive Jog Servers
# ==============================================================================
manipulation_action_server:
  ros__parameters:
    mock_execution: false
    default_velocity: 1.5           # Max joint angular speed ceiling (rad/s)
    approach_z_offset: 0.065        # Pre-grasp elevation above board surface (m)
    action_name: "/manipulation/execute_chess_move"
    controller_action_name: "/arm_trajectory_controller/follow_joint_trajectory"

cartesian_jog_server_node:
  ros__parameters:
    publish_rate_hz: 50.0
    point_dt_s: 0.08
    stale_timeout_s: 0.25
    lpf_alpha: 0.85
    max_joint_vel_rad_s: 2.0
    controller_mode: "trajectory"
    arm_trajectory_topic: "/arm_trajectory_controller/joint_trajectory"
    arm_forward_topic: "/arm_forward_controller/commands"


# ==============================================================================
# TIER 4: Autonomous Chess Mission Orchestrator
# Top-level state machine coordinating game status, vision, nav2, and arm
# ==============================================================================
chess_mission_orchestrator:
  ros__parameters:
    # --- Mission Execution Settings ---
    navigation: true
    robot_color: "white"
    think_time_ms: 1000
    service_timeout_sec: 5.0
    action_timeout_sec: 0.0
    readiness_timeout_sec: 1.0

    # --- Self-Healing & Recovery Settings ---
    recovery:
      auto_recovery_enabled: true
      auto_recovery_timeout_sec: 5.0
      max_recovery_attempts: 3

    # --- Graph Endpoints (Topics, Services, Actions) ---
    topics:
      nav_ready: "/system/nav_ready"
      grasp_ready: "/system/grasp_ready"
      game_status: "/chess/game_status"
      candidate_move: "/chess/candidate_move"
      perception_context: "/perception_context"
      diagnostics: "/diagnostics"

    services:
      check_feasibility: "/workspace/check_move_feasibility"
      recover: "/orchestrator/recover"
      import_fen: "/orchestrator/import_fen"
      export_fen: "/orchestrator/export_fen"
      chess_set_fen: "/chess/set_fen"
      set_perception_context: "/orchestrator/set_perception_context"
      system_reset_readiness: "/system/reset_readiness"

    disturbance:
      local_odom_topic: "/odometry/local"
      global_odom_topic: "/odometry/global"
      uncommanded_linear_thresh: 0.10
      uncommanded_angular_thresh: 0.25
      uncommanded_confirm_duration_sec: 0.20

    actions:
      navigate_to_pose: "/navigate_to_pose"
      execute_chess_move: "/manipulation/execute_chess_move"
      chess_compute_best_move: "/chess/compute_best_move"
      execute_collection_task: "/orchestrator/execute_collection_task"

    # --- Active Observation & Vantage Point Settings ---
    observation:
      standoff_distance: 0.58
      scan_timeout_sec: 5.0
      angle_offsets:
        relocalize: [-2.831, -2.544, -2.248, -1.910, -1.568, -1.067, -0.667, -0.290, 0.082, 0.484, 0.761, 1.147, 1.530, 1.934, 2.312, 2.699, 3.092]
        post_move_verify: [-2.352, -2.176, -1.827, -1.333, -0.991, 0.999, 1.325, 1.879, 2.270]

    # --- 3D Status Visualization (RViz2) ---
    visualization:
      enabled: true
      topic: "~/status_markers"
      hud_z_offset: 0.35
      robot_frame: "base_footprint"
