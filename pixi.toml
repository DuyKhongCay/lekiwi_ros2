[workspace]
name = "lekiwi-host"
description = "LeKiwi Physical-AI Host Stack (Policy Server, Rosbag to LeRobot, Telemetry)"
authors = ["LeKiwi Robotics Team <dev@lekiwi.labs>"]
channels = ["conda-forge"]
platforms = ["linux-64"]
version = "0.1.0"

# ==============================================================================
# 1. Feature: Viewer & Telemetry Tooling (Môi trường nhẹ)
# ==============================================================================
[feature.viewer.dependencies]
python = "3.12.*"
numpy = ">=2.0,<2.3"
pyyaml = ">=6.0.2"

[feature.viewer.pypi-dependencies]
rerun-sdk = ">=0.31.0"
pyzmq = ">=25.0"
msgpack = ">=1.0"

[feature.viewer.tasks]
# Mở Rerun viewer trực quan hóa không gian làm việc 3D & bàn cờ
rerun-viewer = { cmd = "python -m rerun" }


# ==============================================================================
# 2. Feature: LeRobot & Physical-AI GPU Stack (Môi trường chính)
# ==============================================================================
[feature.lerobot.dependencies]
# Python 3.12 khớp 100% với ROS 2 Jazzy (Ubuntu 24.04)
python = "3.12.*"
numpy = ">=2.0,<2.3"
pyyaml = ">=6.0.2"
ffmpeg = "*"

[feature.lerobot.pypi-dependencies]
# LeRobot v0.6.1 mới nhất kèm SmolVLA, Dataset và Viz extras
lerobot = { version = "==0.6.1", extras = ["smolvla", "dataset", "viz"] }
pyzmq = ">=25.0"
msgpack = ">=1.0"
imageio = ">=2.34.0"
pyarrow = "*"
parquet-tools = "*"

[feature.lerobot.tasks]
# --- Task 1: Khởi động Policy Server trên GPU nhận ZeroMQ từ robot ---
server = { cmd = "python -m lerobot_policy_server.cli --host 0.0.0.0 --port 8090" }

# --- Task 2: Chuyển đổi MCAP rosbag cờ vua sang LeRobot Dataset v3.0 ---
# Bọc sub-shell tự động nạp ROS 2 Jazzy và overlay của lekiwi_ros2
convert = { cmd = "bash -c 'source /opt/ros/jazzy/setup.bash && source install/setup.bash 2>/dev/null || true; if [ \"${1-}\" = \"--\" ]; then shift; fi; exec python -m chess_rosbag_to_lerobot.cli \"$@\"' --" }

# --- Task 3: Trực quan hóa dữ liệu dataset sau khi convert ---
viz = { cmd = "lerobot-dataset-viz" }

# --- Task 4: Kiểm tra thông tin môi trường LeRobot & GPU ---
lerobot-info = { cmd = "lerobot-info" }


# ==============================================================================
# 3. Environments Definition
# ==============================================================================
[environments]
default = ["viewer"]
lerobot = ["lerobot"]

