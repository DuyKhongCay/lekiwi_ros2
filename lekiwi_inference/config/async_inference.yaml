async_ros2_inference_client:
  ros__parameters:
    # Remote ZMQ Policy Server endpoint
    server_address: "127.0.0.1:8090"

    # Model Configuration (LeRobot Dataset v3.0 SSOT)
    policy_type: "act"
    repo_id: "DuyKhongCay/act_lekiwi_chess"
    actions_per_chunk: 40
    chunk_size_threshold: 0.5

    # Rate and Freshness Parameters (25 Hz)
    control_rate: 25.0
    max_age_s: 0.04

    # Smoothing & Auto-start
    aggregation_fn: "weighted_average"
    auto_start: true

    # Camera & Joint Topics (3 compressed streams 384x384 @ 25Hz)
    wrist_cam_topic: "/cameras/usb_wrist/image_raw/compressed"
    side_cam_topic: "/cameras/usb_side/image_raw/compressed"
    overhead_cam_topic: "/cameras/stereo_right/image_raw/compressed"
    joints_topic: "/joint_states"
    fwd_cmd_topic: "/arm_forward_controller/commands"
    action_name: "/manipulation/execute_chess_move"

    # Joint Ordering (6-DoF LeKiwi arm)
    arm_joints:
      - "arm_shoulder_pan"
      - "arm_shoulder_lift"
      - "arm_elbow_flex"
      - "arm_wrist_flex"
      - "arm_wrist_roll"
      - "arm_gripper"

    # Convergence & Completion Criteria
    convergence:
      min_episode_duration_s: 3.0
      max_episode_duration_s: 25.0
      settle_window_s: 0.6
      pos_tol_rad: 0.035
      vel_tol_rad: 0.015
