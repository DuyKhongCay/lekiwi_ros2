/**:
  ros__parameters:
    # Camera topics cho wrist_camera
    image_topic: "/cameras/usb_wrist/image_raw"
    camera_info_topic: "/cameras/usb_wrist/camera_info"
    camera_frame: "wrist_camera_optical"

    # TF frame configuration (Eye-in-Hand)
    target_frame: "handeye_target"           # Mốc bàn cờ ChArUco cố định
    base_frame: "base_footprint"         # Gốc robot di động
    robot_effector_frame: "gripper"      # Khâu gắn camera trên cánh tay
    is_eye_in_hand: true                 # Chế độ Eye-in-Hand
    headless: "true"

    # ChArUco Board Specs (giữ nguyên quy cách gốc của LeKiwi target)
    squares_x: 3
    squares_y: 4
    square_length_m: 0.008
    marker_length_m: 0.006
    dictionary: "DICT_4X4_50"
    min_markers: 4
    max_reproj_px: 3.0

    # Controller & Hardware integration (TorqueManagerNode)
    auto_disable_arm_torque: true
    set_torque_service: "/set_torque_enabled"
    output_yaml_path: "/root/docker_ws/lekiwi_ros2/lekiwi_calibration/calib_results/handeye_calib_wrist.yaml"
