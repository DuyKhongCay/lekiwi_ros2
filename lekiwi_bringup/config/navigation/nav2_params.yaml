# Nav2 parameter configuration for LeKiwi Omnidirectional Mobile Base
# Distro: ROS 2 Jazzy (plugin format uses :: separator)
# Stack: SmacPlanner2D (A* 2D Grid) + DWBLocalPlanner (Holonomic vx, vy, vtheta)
# Sensing: Static Arena Map around Chessboard (No LiDAR / No Depth Sensor)
# Safety: Actuation-free recovery only (Wait), E-Stop arbitration via twist_mux

amcl:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/local
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    enable_stamped_cmd_vel: true
    odom_topic: /odometry/local
    current_goal_checker: "general_goal_checker"
    current_progress_checker: "progress_checker"
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.03
      movement_time_allowance: 20.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.06
      yaw_goal_tolerance: 0.12
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"             # Khai báo mô hình động học đa hướng (Holonomic)
      time_steps: 30                   # 30 bước dự phóng (1.5s horizon) - tối ưu cho Pi 5
      model_dt: 0.10                   # Bước thời gian tích phân 50ms
      batch_size: 500                  # 500 quỹ đạo Monte Carlo (vừa vặn CPU Cortex-A76)
      iteration_count: 2
      temperature: 0.3
      gamma: 0.015
      prune_distance: 1.5
      transform_tolerance: 0.2
      visualize: false                 # Tắt visualize markers trên topic để tiết kiệm CPU

      # --- Giới hạn động học (Kinematic Boundaries) ---
      vx_max: 0.20                     # Dải thô tối đa theo đề xuất
      vx_min: -0.20
      vy_max: 0.20                     # Khả năng đi ngang (strafe)
      vy_min: -0.20
      wz_max: 1.00                     # Giới hạn xoay tối đa
      wz_min: -1.00

      # --- Độ lệch chuẩn phân phối lấy mẫu (Sampling Noise) ---
      vx_std: 0.06                     # Bước nhảy mẫu mịn ~0.02 - 0.06 m/s
      vy_std: 0.06
      wz_std: 0.35

      # --- Giới hạn gia tốc (Accelerations) ---
      ax_max: 1.2
      ax_min: -1.5
      ay_max: 1.2
      ay_min: -1.5
      az_max: 2.0
      az_min: -2.0

      # --- Danh sách Critics chuyên biệt cho Omni ---
      critics: [
        "ConstraintCritic",
        "CostCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "TwirlingCritic"
      ]

      # 1. Ràng buộc vật lý (tốc độ, gia tốc)
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      # 2. Chi phí vật cản từ Costmap (Né bàn cờ)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        near_collision_cost: 253
        critical_cost: 300.0
        collision_cost: 1000000.0
        near_goal_distance: 0.25       # Cho phép áp sát đích gần bàn cờ mà không bị chặn sớm (bao phủ cự ly 18cm)
        consider_footprint: false      # Dùng robot_radius dạng tròn để tăng tốc độ tính toán

      # 3. Kéo về đích (Tự động giảm tốc khi d < 0.5m)
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        threshold_to_consider: 0.40    # Kích hoạt sớm từ 40cm để overlap với PathFollowCritic, xóa bỏ vùng chết

      # 4. Xoay đúng góc yaw tại đích
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.25    # Chỉ xoay căn chỉnh khi đã cách đích < 25cm

      # 5. Bám sát tim đường đi của Global Plan
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.30    # Giảm từ 0.50m xuống 0.30m để Omni linh hoạt strafe
        offset_from_furthest: 15
        use_path_orientations: true   # Omni tịnh tiến dọc path mà không cần xoay thân theo path

      # 6. Thúc đẩy robot tiến dọc theo đường đi
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 5
        threshold_to_consider: 0.25    # Giữ lực đẩy tới 25cm (gối đầu liền mạch với GoalCritic)

      # 7. Triệt tiêu xoay thân xe không cần thiết (Giữ hướng cho cánh tay & camera)
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 1.0

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    expected_planner_frequency: 5.0

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.10
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.2
    simulate_ahead_time: 0.4
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 2.0

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_iterations: 1000
      w_data: 0.2
      w_smooth: 0.3
      do_refinement: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.132520
      resolution: 0.02
      track_unknown_space: false
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.50

      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.02
      robot_radius: 0.132520
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.50

      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: false
