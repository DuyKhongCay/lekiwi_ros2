handeye_calibration_node:
  ros__parameters:
    # Camera topics
    image_topic: "/camera/image_raw"
    camera_info_topic: "/camera/camera_info"
    camera_frame: ""                   # Auto-detect from CameraInfo/Image msg if left empty
    
    # TF frame configuration
    target_frame: "handeye_target"     # Broadcasted marker TF
    base_frame: "base_footprint"       # LeKiwi base frame
    robot_effector_frame: "lower_arm" # LeKiwi gripper link
    is_eye_in_hand: false              # false for Eye-to-Hand (overhead / chassis stereo camera), true for Eye-in-Hand (wrist camera)

    # ChArUco Board Specs (matching SO-101 / LeKiwi target)
    squares_x: 3
    squares_y: 4
    square_length_m: 0.008             # 6mm
    marker_length_m: 0.006             # 4.5mm
    dictionary: "DICT_4X4_50"
    min_markers: 4
    max_reproj_px: 3.0

    # Controller and Hardware integration
    auto_disable_arm_torque: true
    switch_controller_service: "/controller_manager/switch_controller"
    set_torque_service: /lekiwisystem/set_torque_enabled
    output_yaml_path: /root/docker_ws/lekiwi_ros2/lekiwi_bringup/config/perception/camera_info/handeye_calib_stereo_left.yaml
