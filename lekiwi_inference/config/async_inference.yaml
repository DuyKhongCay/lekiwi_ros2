async_ros2_inference_client:
  ros__parameters:
    # Remote ZMQ Policy Server endpoint
    server_address: "127.0.0.1:8090"

    # Model Configuration
    policy_type: "act"
    repo_id: "legalaspro/act_so101_pnp_microsanity_20_50hz_v0"
    actions_per_chunk: 100

    # Rate and Deadline Parameters
    control_rate: 50.0
    max_age_s: 0.25

    # Algorithm: weighted_average / conservative / latest_only
    aggregation_fn: "weighted_average"
    auto_start: true

    # Camera & Joint Topics
    wrist_cam_topic: "/cameras/usb_wrist/image_raw/compressed"
    side_cam_topic: "/cameras/usb_side/image_raw/compressed"
    joints_topic: "/joint_states"
    fwd_cmd_topic: "/arm_forward_controller/commands"

    # Joint Ordering (6-DoF LeKiwi arm)
    arm_joints:
      - "arm_shoulder_pan"
      - "arm_shoulder_lift"
      - "arm_elbow_flex"
      - "arm_wrist_flex"
      - "arm_wrist_roll"
      - "arm_gripper"

