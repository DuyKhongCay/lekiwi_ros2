# Configuration for LeKiwi Chess rosbag -> LeRobot v3.0 conversion
robot_type: "lekiwi"
fps: 25

# Reference topic driving the dataset frame clock (25 Hz)
reference_topic: "/cameras/usb_wrist/image_raw/compressed"

# Default freshness window (seconds) if a feature does not override it
default_max_age_s: 0.05

# Fallback task instruction if not present in episode custom_data
task: "Chess pick and place move"

# Allowed task primitives to convert: "move", "clear", "pick", "place"
include_task_types:
  - "move"
  - "clear"
  - "pick"
  - "place"

# Chessboard geometry settings (Single Source of Truth matching chessboard_pose_estimator)
chessboard:
  board_frame: "chessboard_frame"
  base_frame: "base_footprint"
  map_frame: "map"
  # Nominal static board pose in map: [x, y, z, roll, pitch, yaw] (SSOT from perception_config.yaml:78)
  chessboard_pose_in_map: [0.0, 0.0, 0.006, 0.0, 0.0, 0.0]
  square_size_m: 0.0475        # square size
  grasp_clearance_z_m: 0.035  # Height above board surface for grasp point
  landmarks:
    stow: [0.0704, -0.1882, 0.1757]
    clear_left: [-0.0029, 0.1435, 0.1702]
    clear_right: [-0.0027, -0.1451, 0.1633]

# Standard 6-DOF joint names for LeKiwi Arm (lekiwi_manipulation SSOT)
joint_names: &arm_joints
  - arm_shoulder_pan
  - arm_shoulder_lift
  - arm_elbow_flex
  - arm_wrist_flex
  - arm_wrist_roll
  - arm_gripper

features:
  # --- 1. Multi-camera visual observations (384x384x3, 25 FPS) ---
  - key: "observation.images.wrist"
    topic: "/cameras/usb_wrist/image_raw/compressed"
    msg_type: "sensor_msgs/msg/CompressedImage"
    stamp_src: "bag"
    shape: [384, 384, 3]

  - key: "observation.images.side"
    topic: "/cameras/usb_side/image_raw/compressed"
    msg_type: "sensor_msgs/msg/CompressedImage"
    stamp_src: "bag"
    shape: [384, 384, 3]

  - key: "observation.images.overhead"
    topic: "/cameras/stereo_right/image_raw/compressed"
    msg_type: "sensor_msgs/msg/CompressedImage"
    stamp_src: "bag"
    shape: [384, 384, 3]

  # --- 2. Proprioception: Arm joint state observation ---
  - key: "observation.state"
    topic: "/joint_states"
    msg_type: "sensor_msgs/msg/JointState"
    stamp_src: "bag"
    max_age_s: 0.04
    names: *arm_joints

  # --- 3. Action command (Forward Controller or Teleop) ---
  - key: "action"
    topic: "/arm_trajectory_controller/controller_state"
    msg_type: "control_msgs/msg/JointTrajectoryControllerState"
    stamp_src: "bag"
    max_age_s: 0.04
    names: *arm_joints

  # --- 4. Chess Context: 12D Multi-Primitive Spatial conditioning ---
  # LeRobot Environment State vector: [source(3), target(3), is_move, is_clear, is_pick, is_place, has_grasped, has_released]
  - key: "observation.environment_state"
    msg_type: "spatial/environment_state"
    shape: [12]

# Dynamic phase conditioning and episode boundary normalization
phase_conditioning:
  trim_leading_idle_frames: 5        # Giữ tối đa 0.2s (5 frames @ 25Hz) trước khi tay bắt đầu di chuyển
  target_trailing_stow_frames: 25    # Chuẩn hóa đoạn đứng yên tại stow cuối episode về đúng 1.0s (25 frames)
  motion_onset_delta_rad: 0.03       # Ngưỡng lệch góc khớp phát hiện bắt đầu chuyển động
  stow_settle_delta_rad: 0.02        # Ngưỡng lệch góc khớp phát hiện đã dừng hẳn tại stow
  arm_extended_lift_min_rad: -1.0    # arm_shoulder_lift > -1.0 rad xác nhận tay đang vươn khỏi vùng stow
  gripper_open_min_rad: 0.22         # arm_gripper > 0.22 rad xác nhận kẹp mở
  gripper_closed_max_rad: 0.12       # arm_gripper < 0.12 rad xác nhận kẹp đã đóng giữ quân cờ
  min_transport_duration_s: 0.5      # Khoảng trễ tối thiểu giữa t_grasp và t_release cho MOVE/CLEAR

