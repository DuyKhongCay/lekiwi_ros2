# Campaign configuration for 600 episodes data collection (LeRobot 3.0 SmolVLA format)
campaign:
  total_episodes: 600
  episodes_per_session: 20

quotas:
  # 1. MOVE tasks: 240 episodes (40%), 12 piece classes x 20 episodes/piece
  # Includes King & Rook MOVE steps for castling maneuvers.
  move:
    total: 240
    per_piece: 20
    pieces:
      - "w_P"
      - "w_N"
      - "w_B"
      - "w_R"
      - "w_Q"
      - "w_K"
      - "b_P"
      - "b_N"
      - "b_B"
      - "b_R"
      - "b_Q"
      - "b_K"

  # 2. CLEAR tasks: 120 episodes (20%), 10 capturable piece classes x 12 episodes/piece
  # Kings cannot be captured. Bin sides balanced 60 left / 60 right via Round-Robin.
  clear:
    total: 120
    per_piece: 12
    pieces:
      - "w_P"
      - "w_N"
      - "w_B"
      - "w_R"
      - "w_Q"
      - "b_P"
      - "b_N"
      - "b_B"
      - "b_R"
      - "b_Q"
    bins:
      left: 60
      right: 60

  # 3. PICK tasks: 120 episodes (20%), 12 piece classes x 10 episodes/piece
  # Activated for multi-base moves or downgraded (force_pick_place) single-base moves.
  pick:
    total: 120
    per_piece: 10
    pieces:
      - "w_P"
      - "w_N"
      - "w_B"
      - "w_R"
      - "w_Q"
      - "w_K"
      - "b_P"
      - "b_N"
      - "b_B"
      - "b_R"
      - "b_Q"
      - "b_K"

  # 4. PLACE tasks: 120 episodes (20%), 12 piece classes x 10 episodes/piece
  # Paired with PICK steps to complete piece placement.
  place:
    total: 120
    per_piece: 10
    pieces:
      - "w_P"
      - "w_N"
      - "w_B"
      - "w_R"
      - "w_Q"
      - "w_K"
      - "b_P"
      - "b_N"
      - "b_B"
      - "b_R"
      - "b_Q"
      - "b_K"

