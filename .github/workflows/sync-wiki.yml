name: Sync Documentation to GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/scripts/sync_wiki.py'
      - 'scripts/sync_wiki.py'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

# Enforce least-privilege permissions at workflow level
permissions:
  contents: read

# Prevent concurrent wiki sync deployments that may cause git conflicts
concurrency:
  group: wiki-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-wiki:
    name: Sync docs to GitHub Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: source

      - name: Validate and resolve Wiki authentication token
        id: auth
        env:
          CUSTOM_PAT: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          if [ -z "$CUSTOM_PAT" ]; then
            echo "::error::Secret WIKI_SYNC_TOKEN not found! GitHub Wiki (.wiki.git) strictly requires a Personal Access Token (classic) with 'repo' scope. Default GITHUB_TOKEN is rejected by GitHub with HTTP 403."
            echo "Please create a Personal Access Token (classic) with 'repo' scope and add it to Repository Secrets as WIKI_SYNC_TOKEN."
            exit 1
          fi
          echo "token=$CUSTOM_PAT" >> "$GITHUB_OUTPUT"

      - name: Checkout Wiki repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ steps.auth.outputs.token }}

      - name: Execute documentation transformation and sync
        run: |
          SCRIPT_PATH="source/.github/scripts/sync_wiki.py"
          python3 "$SCRIPT_PATH" \
            --docs-dir source/docs \
            --wiki-dir wiki

      - name: Commit and push changes to GitHub Wiki
        working-directory: wiki
        env:
          WIKI_TOKEN: ${{ steps.auth.outputs.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check for changes
          if [ -z "$(git status --porcelain)" ]; then
            echo "ℹ️ No changes detected between docs/ and wiki. Skipping commit."
            exit 0
          fi

          echo "📝 Changes detected. Staging and committing..."
          git add -A
          git commit -m "docs: sync documentation from commit ${COMMIT_SHA:0:7} [skip ci]"

          # Explicitly set authenticated remote URL with token for pushing
          git remote set-url origin "https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          git push origin master
          echo "🚀 Successfully synced documentation to GitHub Wiki!"

