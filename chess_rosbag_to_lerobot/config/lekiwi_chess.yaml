# Configuration for LeKiwi Chess rosbag -> LeRobot v3.0 conversion
robot_type: "lekiwi"
fps: 25

# Reference topic driving the dataset frame clock (25 Hz)
reference_topic: "/cameras/usb_wrist/image_raw/compressed"

# Default freshness window (seconds) if a feature does not override it
default_max_age_s: 0.04

# Fallback task instruction if not present in episode custom_data
task: "Chess pick and place move"

# Chessboard geometry settings (Single Source of Truth matching chessboard_pose_estimator)
chessboard:
  board_frame: "chessboard_frame"
  base_frame: "base_footprint"
  square_size_m: 0.037        # square size
  grasp_clearance_z_m: 0.035  # Height above board surface for grasp point
  origin_at_center: true      # (0, 0, 0) is at center of the 8x8 chessboard

# Standard 6-DOF joint names for LeKiwi Arm (lekiwi_manipulation SSOT)
joint_names: &arm_joints
  - arm_shoulder_pan
  - arm_shoulder_lift
  - arm_elbow_flex
  - arm_wrist_flex
  - arm_wrist_roll
  - arm_gripper

features:
  # --- 1. Multi-camera visual observations (384x384x3, 25 FPS) ---
  - key: "observation.images.wrist"
    topic: "/cameras/usb_wrist/image_raw/compressed"
    msg_type: "sensor_msgs/msg/CompressedImage"
    stamp_src: "bag"
    shape: [384, 384, 3]

  - key: "observation.images.side"
    topic: "/cameras/usb_side/image_raw/compressed"
    msg_type: "sensor_msgs/msg/CompressedImage"
    stamp_src: "bag"
    shape: [384, 384, 3]

  - key: "observation.images.overhead"
    topic: "/cameras/stereo_right/image_raw/compressed"
    msg_type: "sensor_msgs/msg/CompressedImage"
    stamp_src: "bag"
    shape: [384, 384, 3]

  # --- 2. Proprioception: Arm joint state observation ---
  - key: "observation.state"
    topic: "/joint_states"
    msg_type: "sensor_msgs/msg/JointState"
    stamp_src: "bag"
    max_age_s: 0.04
    names: *arm_joints

  # --- 3. Action command (Forward Controller or Teleop) ---
  - key: "action"
    topic: "/arm_trajectory_controller/controller_state"
    msg_type: "control_msgs/msg/JointTrajectoryControllerState"
    stamp_src: "bag"
    max_age_s: 0.04
    names: *arm_joints

  # --- 4. Chess Context: 3D pick & place target coordinates ---
  # LeRobot Environment State conditioning (vector 6D: [pick_point(3), place_point(3)]) for ACT / Diffusion Policy
  - key: "observation.environment_state"
    msg_type: "spatial/environment_state"
    shape: [6]  # [pick_x, pick_y, pick_z, place_x, place_y, place_z] relative to base_footprint / chessboard_frame

