# twist_mux configuration for LeKiwi Mobile Base
# Priority arbitration ensures safety and e-stop outrank autonomous navigation

twist_mux:
  ros__parameters:
    use_stamped: true
    topics:
      navigation:
        topic: /cmd_vel_nav
        timeout: 0.5
        priority: 10
      teleop:
        topic: /cmd_vel_teleop
        timeout: 0.5
        priority: 100
      calib:
        topic: /cmd_vel_calib
        timeout: 0.5
        priority: 200
