# Chess Master Configuration for LeKiwi Autonomous Play
# Distro: ROS 2 Jazzy | Stockfish engine, FEN state tracker, and 2D visualizer

/**:
  ros__parameters:
    # Stockfish Engine parameters
    stockfish_path: "/usr/games/stockfish"
    think_time_ms: 1000
    action_name: "/chess/compute_best_move"

    # Game State Tracker & Auto-play parameters
    raw_fen_topic: "/chess/raw_fen"
    game_status_topic: "/chess/game_status"
    set_fen_service: "/chess/set_fen"
    debounce_frames: 3
    robot_color: "black"          # Robot player piece color ("black" or "white")

chessboard_2d_visualizer:
  ros__parameters:
    game_status_topic: "/chess/game_status"
    candidate_move_topic: "/chess/candidate_move"
    raw_fen_topic: "/chess/raw_fen"
    board_2d_topic: "/chess/board_2d/compressed"
    jpeg_quality: 85
    board_panel_size: 480
    debug: true
    render_rate_hz: 5.0

