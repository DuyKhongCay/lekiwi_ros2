# Fast development / test configuration for LeKiwi Chess conversion
robot_type: "lekiwi"
fps: 25

reference_topic: "/cameras/usb_wrist/image_raw/compressed"
default_max_age_s: 0.10
task: "Chess move development test"

chessboard:
  board_frame: "chessboard_frame"
  base_frame: "base_footprint"
  square_size_m: 0.040
  grasp_clearance_z_m: 0.025
  origin_at_center: true

joint_names: &arm_joints
  - arm_shoulder_pan
  - arm_shoulder_lift
  - arm_elbow_flex
  - arm_wrist_flex
  - arm_wrist_roll
  - arm_gripper

features:
  - key: "observation.images.wrist"
    topic: "/cameras/usb_wrist/image_raw/compressed"
    msg_type: "sensor_msgs/msg/CompressedImage"
    stamp_src: "bag"
    shape: [384, 384, 3]

  - key: "observation.state"
    topic: "/joint_states"
    msg_type: "sensor_msgs/msg/JointState"
    stamp_src: "bag"
    max_age_s: 0.05
    names: *arm_joints

  - key: "action"
    topic: "/joint_states" # Fallback to joint_states if commands not recorded
    msg_type: "sensor_msgs/msg/JointState"
    stamp_src: "bag"
    max_age_s: 0.05
    names: *arm_joints
