controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    omni_base_controller:
      type: omni_wheel_drive_controller/OmniWheelDriveController

arm_controller:
  ros__parameters:
    joints:
      - arm_shoulder_pan
      - arm_shoulder_lift
      - arm_elbow_flex
      - arm_wrist_flex
      - arm_wrist_roll
      - arm_gripper
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0

omni_base_controller:
  ros__parameters:
    wheel_names: [base_right_wheel, base_left_wheel, base_back_wheel]
    wheel_offset: 0.5235987756
    robot_radius: 0.125
    wheel_radius: 0.05
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    open_loop: false
    position_feedback: false
    cmd_vel_timeout: 0.25
    diagonal_covariance:
      pose: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
      twist: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
