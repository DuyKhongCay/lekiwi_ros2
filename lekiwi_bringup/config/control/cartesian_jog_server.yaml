cartesian_jog_server_node:
  ros__parameters:
    publish_rate_hz: 50.0
    point_dt_s: 0.08
    stale_timeout_s: 0.25
    lpf_alpha: 0.85
    controller_type: "joint_trajectory"

    arm_trajectory_topic: "/arm_trajectory_controller/joint_trajectory"
    arm_forward_topic: "/arm_forward_controller/commands"
    joint_states_topic: "/joint_states"
    robot_description_topic: "/robot_description"

    # Base frame and tool tip for Cartesian IK
    base_frame: "base_footprint"
    tip_frame: "gripperframe"
    safety_margin_rad: 0.0

    # Joint names in 5-DoF kinematic chain order
    arm_joint_names:
      - "arm_shoulder_pan"
      - "arm_shoulder_lift"
      - "arm_elbow_flex"
      - "arm_wrist_flex"
      - "arm_wrist_roll"

