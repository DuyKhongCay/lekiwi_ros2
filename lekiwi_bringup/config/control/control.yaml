# ==============================================================================
# LeKiwi Control Subsystem Configuration (control.yaml)
# ==============================================================================

workspace_checker:
  ros__parameters:
    map_frame: map
    board_frame: chessboard_frame
    base_frame: base_footprint
    tag_border_margin: 0.0012
    tag_positions_x: [-0.1926, 0.1938, 0.1912, -0.1924]
    tag_positions_y: [-0.1932, -0.1928, 0.1934, 0.1926]
    planning.edge_clearance: 0.178
    planning.sample_step: 0.025
    planning.max_samples: 25
    planning.default_pitch: -1.57079632679
    planning.default_roll: 0.0
    tf.max_age_sec: 0.30
    tf.planar_tolerance_rad: 0.01
    diagnostics.rate_hz: 1.0

torque_manager:
  ros__parameters:
    torque_controller_topic: /robot_torque_controller/commands
    startup_policy: enabled
    manage_controllers: true
    switch_controller_service: /controller_manager/switch_controller
    arm_controllers:
      - arm_trajectory_controller
    base_controllers:
      - omni_base_controller
    arm_joints:
      - arm_shoulder_pan
      - arm_shoulder_lift
      - arm_elbow_flex
      - arm_wrist_flex
      - arm_wrist_roll
      - arm_gripper
    base_joints:
      - base_left_wheel
      - base_back_wheel
      - base_right_wheel
    joint_names:
      - arm_shoulder_pan
      - arm_shoulder_lift
      - arm_elbow_flex
      - arm_wrist_flex
      - arm_wrist_roll
      - arm_gripper
      - base_left_wheel
      - base_back_wheel
      - base_right_wheel

tf_gatekeeper_node:
  ros__parameters:
    max_pos_variance: 0.0012
    max_yaw_variance: 0.0030
    # max_pos_variance: 0.0020
    # max_yaw_variance: 0.0050
    max_transform_age_sec: 0.30
    max_stop_velocity: 0.03
    max_stop_angular_vel: 0.08
    check_frequency_hz: 10.0
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    ee_frame: gripperframe
    board_frame: chessboard_frame
    required_arm_joints:
      - arm_shoulder_pan
      - arm_shoulder_lift
      - arm_elbow_flex
      - arm_wrist_flex
      - arm_wrist_roll
      - arm_gripper

