chess_mission_orchestrator:
  ros__parameters:
    # --- Mission Execution Settings ---
    robot_color: "b"
    board_frame: "chessboard_frame"
    map_frame: "map"
    feasibility_timeout_sec: 5.0
    action_timeout_sec: 60.0
    readiness_timeout_sec: 1.0
    skip_navigation: false
    start_navigation: false

    # --- Self-Healing & Recovery Settings ---
    recovery:
      auto_recovery_enabled: true
      auto_recovery_timeout_sec: 5.0
      max_recovery_attempts: 3

    # --- Topic Endpoints (Configurable) ---
    topics:
      tf_ready: "/system/tf_ready"
      game_status: "/chess/game_status"
      camera_mode: "/camera_mode"
      diagnostics: "/diagnostics"

    # --- Service Endpoints ---
    services:
      check_feasibility: "/workspace/check_move_feasibility"
      recover: "/orchestrator/recover"

    # --- Action Endpoints ---
    actions:
      navigate_to_pose: "/navigate_to_pose"
      execute_chess_move: "/manipulation/execute_chess_move"

tf_gatekeeper_node:
  ros__parameters:
    max_pos_variance: 0.0012
    max_yaw_variance: 0.0030
    max_transform_age_sec: 0.30
    max_stop_velocity: 0.03
    max_stop_angular_vel: 0.08
    check_frequency_hz: 10.0
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    ee_frame: gripperframe
    board_frame: chessboard_frame
    required_arm_joints:
      - arm_shoulder_pan
      - arm_shoulder_lift
      - arm_elbow_flex
      - arm_wrist_flex
      - arm_wrist_roll
      - arm_gripper

workspace_checker:
  ros__parameters:
    map_frame: map
    board_frame: chessboard_frame
    base_frame: base_footprint
    tip_frame: gripperframe
    board_size: [0.380, 0.380]
    planning.edge_clearance: 0.147
    planning.sample_step: 0.025
    planning.max_samples: 257
    planning.default_pitch: -1.57079632679
    planning.default_roll: 0.0
    tf.max_age_sec: 0.30
    tf.planar_tolerance_rad: 0.01
