/**:
  ros__parameters:
    tag_family: "16h5"
    tag_size: 0.029
    detection_rate_hz: 5.0
    calib: false
    min_tags_cnt: 2

    # Calibrated tag definitions in chessboard_frame (origin at CENTER of board):
    # +X: File A -> H (Left -> Right)
    # +Y: Rank 1 -> 8 (Bottom -> Top)
    # +Z: Normal pointing up perpendicular to the board
    tags:
      # Calibration Date & Time: 2026-09-19 00:23:32
      ids: [0, 1, 2, 3]
      names: [A1, H1, H8, A8]
      positions_x: [-0.1926, 0.1938, 0.1912, -0.1924]
      positions_y: [-0.1932, -0.1928, 0.1934, 0.1926]
      positions_z: [0.004, 0.004, 0.004, 0.004]
      yaws: [0.0, 0.0203, -0.0095, 0.0051]



    # Frame IDs
    map_frame: "map"
    odom_frame: "odom"
    chessboard_frame: "chessboard_frame"
    camera_frame: "stereo_left_optical"
    base_frame: "base_footprint"

    # Board nominal pose in map: [x, y, z, roll, pitch, yaw]
    chessboard_pose_in_map: [0.0, 0.0, 0.004, 0.0, 0.0, 0.0]

    # Static TF Broadcasting (map -> chessboard_frame)
    publish_tf: true
